name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-core-tests:
    name: Node.js Domain, Providers & API Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Domain & Provider Adapter Tests
        run: pnpm test

      - name: Run Architecture Scaffold Check
        run: pnpm check:architecture

      - name: Run Synthetic Price Simulation Demo
        run: pnpm demo

      - name: Build Application Packages
        run: pnpm application:build

      - name: Build Database Layer
        run: pnpm db:build

      - name: Typecheck API
        run: pnpm api:typecheck

      - name: Build API
        run: pnpm api:build

  python-ai-tests:
    name: Python AI Service & Gateways Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AI Service Unit & Matching Guard Tests
        run: python -m unittest discover -s apps/ai-service/tests -v

  docker-compose-validation:
    name: Infrastructure Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose --profile cache -f infra/local/compose.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-compose-validation-postgres
          NUKHBAPAY_DB_MIGRATION_PASSWORD: ci-compose-validation-migration
          NUKHBAPAY_DB_RUNTIME_PASSWORD: ci-compose-validation-runtime
          REDIS_PASSWORD: ci-compose-validation-redis
