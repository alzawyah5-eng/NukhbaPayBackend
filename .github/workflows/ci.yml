name: Backend CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-core-tests:
    name: Node.js Domain, Providers & API Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.x
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Domain & Provider Adapter Tests
        run: pnpm test

      - name: Run Architecture Scaffold Check
        run: pnpm check:architecture || python3 scripts/check_structure.py

      - name: Run Synthetic Price Simulation Demo
        run: pnpm demo

      - name: Build Application Packages
        run: pnpm application:build

      - name: Build Database Layer
        run: pnpm db:build

      - name: Typecheck API
        run: pnpm api:typecheck

      - name: Build API
        run: pnpm api:build

  python-ai-tests:
    name: Python AI Service & Gateways Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/ai-service/requirements.txt ]; then pip install -r apps/ai-service/requirements.txt; fi

      - name: Run AI Service Unit & Matching Guard Tests
        run: python -m unittest discover -s apps/ai-service/tests -v

  docker-compose-validation:
    name: Infrastructure Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          if [ -f infra/local/docker-compose.yml ]; then
            docker compose -f infra/local/docker-compose.yml config --quiet
            echo "Docker Compose config syntax is valid."
          fi
